name: Validate marketplace manifest

# Gate every PR on `claude plugin validate` so a malformed marketplace.json
# (bad entry shape, invalid source, schema drift) cannot reach `main`.
# Delegates to the org-wide reusable workflow in devops-excellence (ADR-038)
# so the gate stays DRY; each listed plugin is validated in its own source
# repo's CI by the same reusable workflow.
#
# `claude plugin validate` is a local, auth-free schema check, so it needs no
# secrets.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: Integral-Productivity/devops-excellence/.github/workflows/reusable-validate-plugin-manifest.yml@main
    with:
      manifest-path: .claude-plugin/marketplace.json
